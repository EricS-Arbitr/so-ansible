---
so_sensor_answer_name: "so-ansible-sensor"
so_sensor_install_timeout: 1200   # 20 min (similar to search)
so_sensor_poll_interval: 30
so_sensor_setup_log: "/root/so-setup.log"
so_sensor_installed_marker: "/opt/so/state/installed"

# Separate marker for so-setup completion (see so_search defaults for
# rationale). Retries don't re-invoke 30-45 min of so-setup on a failed
# grid-join or so-status verify.
so_sensor_setup_marker: "/opt/so/state/setup-completed"

# Netplan drop-in path for our GRE tunnel.
so_sensor_netplan_tun: "/etc/netplan/60-so-mirror-tun.yaml"

# Create /etc/SOCLOUD so so-setup takes its "cloud" interface path, which
# is the only path that honors BNICS as the monitor interface instead of
# hardcoding INTERFACE=bond0. See the long comment in tasks/main.yml.
# Set false to get stock (bond0) behavior back.
so_sensor_force_cloud_mode: true
