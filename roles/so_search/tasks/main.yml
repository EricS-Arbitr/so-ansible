---
# =========================================================================
# so_search — join manager as SEARCHNODE
# =========================================================================
# Structurally identical to so_manager except for template + answer name.
# Kept as its own role (rather than parameterizing so_manager) so future
# per-role divergence (heap-tuning, disk layout, etc.) is trivial to add.

- name: Idempotency probe
  ansible.builtin.stat:
    path: "{{ so_search_installed_marker }}"
  register: so_installed

- name: End play early on this host if SO is already installed
  ansible.builtin.meta: end_host
  when: so_installed.stat.exists

- name: Precondition — SO source must be at {{ so_source_dest }}
  ansible.builtin.stat:
    path: "{{ so_source_dest }}/setup/so-setup"
  register: so_setup_present

- name: Fail loudly if so_base didn't stage the source
  ansible.builtin.fail:
    msg: |
      SO source missing at {{ so_source_dest }}/setup/so-setup. Re-run 30-prereqs.
  when: not so_setup_present.stat.exists

- name: Gather network facts (need per-iface ipv4)
  ansible.builtin.setup:
    gather_subset:
      - network

- name: Compute so_prod_nic
  ansible.builtin.set_fact:
    so_prod_nic: >-
      {{ (ansible_facts['interfaces']
          | map('regex_replace', '-', '_')
          | map('extract', ansible_facts)
          | selectattr('ipv4', 'defined')
          | selectattr('ipv4.address', 'equalto', so_prod_ip)
          | map(attribute='device')
          | list
          | first) }}

- name: Compute so_prod_netmask
  ansible.builtin.set_fact:
    so_prod_netmask: >-
      {{ {16:'255.255.0.0', 20:'255.255.240.0', 22:'255.255.252.0',
          23:'255.255.254.0', 24:'255.255.255.0', 25:'255.255.255.128',
          26:'255.255.255.192', 27:'255.255.255.224', 28:'255.255.255.240',
          29:'255.255.255.248', 30:'255.255.255.252',
          31:'255.255.255.254', 32:'255.255.255.255'
      }[so_prod_prefix | int] }}

- name: Render search answer file to /root/so-answers.env
  ansible.builtin.template:
    src: search.env.j2
    dest: /root/so-answers.env
    mode: '0600'
    owner: root
    group: root

- name: Kick off so-setup network (bash-source env then invoke)
  ansible.builtin.shell: |
    source /root/so-answers.env
    cd {{ so_source_dest }}/setup
    ./so-setup {{ so_setup_type }} > {{ so_search_setup_log }} 2>&1
  args:
    executable: /bin/bash
    creates: "{{ so_search_installed_marker }}"
  async: "{{ so_search_install_timeout }}"
  poll: 0
  register: so_setup_async

- name: Poll so-setup completion
  ansible.builtin.async_status:
    jid: "{{ so_setup_async.ansible_job_id }}"
  register: so_setup_result
  until: so_setup_result.finished
  retries: "{{ (so_search_install_timeout / so_search_poll_interval) | int }}"
  delay: "{{ so_search_poll_interval }}"

- name: Report so-setup exit code + last log lines
  ansible.builtin.debug:
    msg: |
      so-setup rc={{ so_setup_result.rc | default('unknown') }}
      Last 20 log lines:
      {{ so_setup_result.stdout_lines[-20:] | default(['<no stdout captured>']) | join('\n') }}

- name: Fail if so-setup exited non-zero
  ansible.builtin.fail:
    msg: |
      so-setup returned {{ so_setup_result.rc }}. Full log at
      {{ so_search_setup_log }} on {{ inventory_hostname }}.
  when: so_setup_result.rc | default(1) != 0

# so-setup does NOT write this marker on its own (2026-07-23). Touch it
# after successful completion so the idempotency probe short-circuits
# subsequent runs. See same task in so_manager for rationale.
- name: Write installed marker for idempotent re-runs
  ansible.builtin.file:
    path: "{{ so_search_installed_marker }}"
    state: touch
    mode: '0644'
    owner: root
    group: root

# --- Grid-join handshake (delegated to manager) -------------------------
# so-setup only performs a lightweight one-shot handshake at install time
# via SOREMOTEPASS. It does NOT re-invoke on subsequent minion re-auth,
# and it does NOT populate so-firewall or generate the per-minion pillar.
# Result: after so-setup completes with rc=0, the joining node is
# actually stuck — salt-minion can't reach master (firewall drops
# TCP 4505/4506), and highstate would fail even if it could
# (per-minion pillar missing). Verified 2026-07-27 on so-search.
#
# Fix: from the joining node's role, delegate three tasks to the manager
# to finish the grid-join steps that so-setup should have done itself:
#   1. Add this node's IP to the appropriate so-firewall hostgroup so
#      TCP 4505/4506 (salt master) opens for it.
#   2. Run so-minion -o=add to accept the salt-key AND generate the
#      per-minion pillar files under /opt/so/saltstack/local/pillar/minions/.
#   3. Kick a state.highstate for the joining node so it pulls docker
#      + container images + configs from the master in one push.

- name: Grid join — on manager, add this node's IP to searchnode firewall hostgroup
  ansible.builtin.command: "sudo /usr/sbin/so-firewall includehost searchnode {{ so_prod_ip }}"
  delegate_to: "{{ groups['so_manager'][0] }}"
  become: true
  register: fw_add
  changed_when: "'Successfully added' in fw_add.stdout"

- name: Grid join — on manager, apply firewall state (opens 4505/4506 for this node)
  ansible.builtin.command: sudo salt-call state.apply firewall
  delegate_to: "{{ groups['so_manager'][0] }}"
  become: true
  async: 600
  poll: 15
  changed_when: false

- name: Grid join — on manager, so-minion -o=add (accept key + generate per-minion pillar)
  ansible.builtin.command: "sudo /usr/sbin/so-minion -o=add -m={{ inventory_hostname }}_{{ so_role }}"
  delegate_to: "{{ groups['so_manager'][0] }}"
  become: true
  register: so_min_add
  # so-minion -o=add returns success both on fresh accept and on "key already
  # accepted, re-generating pillar" — both are what we want. Only fail on hard errors.
  failed_when:
    - so_min_add.rc != 0
    - "'does not match any unaccepted keys' not in so_min_add.stdout"

- name: Grid join — kick highstate on this node (fire-and-forget; so-status wait below covers it)
  ansible.builtin.command: "sudo salt {{ inventory_hostname }}_{{ so_role }} state.highstate --async"
  delegate_to: "{{ groups['so_manager'][0] }}"
  become: true
  changed_when: false

- name: Reboot the search node
  ansible.builtin.reboot:
    reboot_timeout: 900
    connect_timeout: 60
    post_reboot_delay: 30

- name: Verify search node has joined the grid (so-status)
  ansible.builtin.command: sudo so-status
  register: so_status
  changed_when: false
  # Post-reboot, the grid-join highstate pushed above needs to install
  # docker + pull the elasticsearch/logstash images from the manager's
  # registry + start the 4 search-node containers (elasticsearch,
  # logstash, sensoroni, telegraf). Empirically 8-12 min. 40 × 30s = 20 min ceiling.
  retries: 40
  delay: 30
  until: so_status.rc == 0

- name: Report search node status
  ansible.builtin.debug:
    msg: "{{ so_status.stdout_lines[-15:] }}"
