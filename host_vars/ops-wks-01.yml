---
# host_vars/ops-wks-01.yml — Operations workstation
# Image:   global/RDP_Windows_10:1.2.0
# Prod:    Operations 172.16.8.5/24 → gw 172.16.8.1
# Mgmt:    10.255.240.120/20 (position FIRST)
#
# network_interfaces drives the `common` role (00-setup.yml). Schema is
# fixed by common/tasks/windows.yml: a list of dicts with `name` matching
# the adapter alias AFTER 00-setup's rename play, plus ipv4.address /
# ipv4.netmask and optional ipv4.gateway + dns.
ansible_host: "10.255.240.120"

network_interfaces:
  - name: "Ethernet0"              # mgmt — position FIRST in the blueprint
    ipv4:
      address: "10.255.240.120"
      netmask: "255.255.240.0"
      gateway: ""                  # mgmt plane is gateway-less in-scenario
  - name: "Ethernet1"              # production — Operations
    ipv4:
      address: "172.16.8.5"
      netmask: "255.255.255.0"
      gateway: "172.16.8.1"
# NOTE: `dns` is deliberately omitted on both interfaces. common's DNS
# tasks are guarded by `when: item.dns is defined`, so leaving it out means
# the role does not touch resolver config. These hosts currently resolve
# via the platform, and there is no AD DNS in this range to point them at
# (DC01 is never promoted). Add a `dns:` list here if that changes.
