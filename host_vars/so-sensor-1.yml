---
# host_vars/so-sensor-1.yml — SO 2.4.x Sensor node (Zeek + Suricata + Stenographer)
# Image:   global/RDP_Ubuntu_Desktop_22.04.5:1.1.0 (16 vCPU / 32 GB)
# Prod:    security 172.16.5.20/24 → gw 172.16.5.1
# Mgmt:    10.255.240.102/20 (position FIRST)
#
# Note: new platform does not support mirror NICs. Traffic capture is via
# GRE-encapsulated mirror from router-0 (see vyos_mirror role). Suricata +
# Zeek bind to the tun0 tunnel interface (or to eth1 with a GRE filter,
# depending on which pattern works better with SO's own bond0 defaults).
ansible_host: "10.255.240.102"
ansible_user: "simspace"
ansible_python_interpreter: "/usr/bin/python3"

so_role: "sensor"
so_hostname: "so-sensor-1"
so_prod_ip: "172.16.5.20"
so_prod_prefix: 24
so_prod_gateway: "172.16.5.1"
so_prod_dns:
  - "10.255.240.157"

# tun0 endpoint on the sensor side — router-0's tun0 remote points at
# so_prod_ip; the tunnel address (10.100.0.0/30) is arbitrary internal.
so_gre_tunnel_local: "10.100.0.2"
so_gre_tunnel_remote: "10.100.0.1"
so_gre_tunnel_prefix: 30

# The mirroring router's GRE endpoint -- the UNDERLAY remote, i.e. the source
# address the encapsulated packets actually arrive from. Drives two things:
#   * the netplan tunnel's `remote:` (kernel will not decapsulate unless this
#     matches the sender exactly)
#   * the sensor's SO firewall ACCEPT for proto 47
#
# PORTING TRAP: in the so-ansible dev range this value happened to EQUAL the
# sensor's so_prod_gateway, because the mirroring router was also the sensor's
# gateway. Both the firewall rule and the netplan template were written against
# that coincidence. Here every sensor's gateway is 172.16.9.1 while the
# mirroring routers are elsewhere entirely, so it must be stated explicitly.
# There is deliberately NO default -- so_sensor fails loudly if it is unset.
so_gre_remote_underlay: "172.16.5.1"   # router-0 vyos_gre_source_ip
so_monitor_interface: "tun0"

# --- network_interfaces for the `common` role (00-setup.yml) --------------
# Added 2026-07-29. Schema is fixed by common/tasks/linux.yml, which feeds
# it to community.general.nmcli — note the Linux form REQUIRES ipv4.type
# (the Windows form in host_vars/*wks*.yml does not).
#
# Values mirror the so_prod_* / mgmt facts already defined above; they are
# duplicated rather than referenced because `common` is a copied upstream
# role and keeping its input literal makes a bad render obvious on sight.
network_interfaces:
  - name: "eth0"                   # mgmt — position FIRST in the blueprint
    ipv4:
      type: "ethernet"
      address: "10.255.240.102"
      netmask: "255.255.240.0"
      gateway: ""                  # mgmt plane is gateway-less in-scenario
  - name: "eth1"                   # production — security 172.16.5.0/24
    ipv4:
      type: "ethernet"
      address: "172.16.5.20"
      netmask: "255.255.255.0"
      gateway: "172.16.5.1"
    dns:
      - "10.255.240.157"                    # ansible controller (also the SO mirror)
