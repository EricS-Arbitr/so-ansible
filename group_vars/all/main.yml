---
# =========================================================================
# group_vars/all.yml — cross-cutting defaults for so-ansible
# =========================================================================
# Per project_so_architecture_decisions memory (2026-07-20):
#   1. Ansible on 10.255.240.157 dual-homed on mgmt + control-10
#   2. so-setup driven by preseed files (schema pending research)
#   3. Windows out of scope for THIS project
#   4. Updates via ansible-hosted local mirror at http://10.255.240.157/
#   5. Traffic capture via VyOS GRE-mirror to sensor + Elastic Agent on endpoints
# =========================================================================

# --- Security Onion version + install source ---
# IMPORTANT: the flexible `automation/` mechanism we depend on (positional
# arg to so-setup that bash-sources a template) exists ONLY on master, not
# in any tagged release including 2.4.141, 2.4.211, or 3.1.0. Confirmed
# 2026-07-20 by inspecting so-setup source at each tag. See
# UPSTREAM_FIXES.md · 2026-07-20 entry.
#
# We pin to a specific master commit SHA and snapshot everything into
# files/setup-automation-source/. On upgrades, refresh SHA + re-snapshot
# + diff. See files/setup-automation-source/SOURCE_SHA.txt for the pin.
# CORRECTION 2026-07-22: SO's `master` branch is 2.3.300 (legacy). Real
# 2.4 development lives on `2.4/main` (currently 2.4.211) and `2.4/dev`.
# The setup/automation/ answer-file mechanism only exists at 2.3.300 —
# 2.4/main and 2.4/dev have NO automation dir → the only non-interactive
# install path for SO 2.4 is a pexpect wrapper driving the whiptail TUI.
# See UPSTREAM_FIXES.md · 2026-07-22 entry for the branch discovery.
so_git_ref: "55af7eb541f086c4e7d6d3182fb2bc4fbc2b9e21"  # 2.4/main HEAD @ 2026-07-22
so_git_branch: "2.4/main"
so_git_repo: "https://github.com/Security-Onion-Solutions/securityonion.git"

# --- Install mode: NETWORK ---
# so-setup network on Ubuntu. Interactive TUI, driven by pexpect from
# the so_manager/so_search/so_sensor roles (pexpect wrapper is next
# session's work — current roles are stubs that will fail loudly).
so_setup_type: "network"

# --- Corp proxy for SO nodes' upstream package fetches ---
# SO 2.4 network install pulls from packages.securityonion.net + Docker +
# Elastic + Ubuntu jammy security repos. All egress via mgmt-plane proxy
# on 10.255.240.1:3128 (matches airfield-range/PowerPlant convention).
so_upstream_proxy: "http://10.255.240.1:3128"

# --- Ansible-hosted mirror ---
# Scope: serves SO source tarball at pinned SHA. so_base pulls it from
# here rather than hitting github.com through the proxy. ISO serving
# dropped (see so_setup_type note above).
so_mirror_host: "10.255.240.157"
so_mirror_port: 80
so_mirror_url: "http://{{ so_mirror_host }}:{{ so_mirror_port }}"
so_source_tarball_url: "{{ so_mirror_url }}/so-source/securityonion-{{ so_git_ref[:12] }}.tar.gz"

# Filename of the bundled ETOPEN rules tarball as served from /so-source/.
# MUST live here, not in a role's defaults: it is consumed by BOTH
# so_apt_mirror (which publishes the file, on the controller) and so_manager
# (which patches soc.json to point at it, on the manager). Role defaults are
# role-scoped, so a definition inside so_apt_mirror is invisible to
# so_manager — those roles run in different plays against different hosts.
# That is exactly how this broke on 2026-07-29: the soc.json task failed
# with "'so_bundled_rules_filename' is undefined" the first time it ever
# reached a fresh manager.
so_bundled_rules_filename: "emerging.rules.tar.gz"

# --- SO airgap mode (IS-INET ranges) -------------------------------------
# Target ranges have NO real internet on the in-game plane — only a staged
# simulation (RC-IS-INET), as in so-ab-pp and airfield-range. SOC's detection
# engines otherwise try to reach github + rules.emergingthreats.net every 5
# minutes and fail forever.
#
# SO has first-class airgap support keyed off ONE pillar boolean
# (`global:airgap`, read by vars/globals.map.jinja). Setting it swaps every
# remote content source for a local path. See
# roles/so_manager/tasks/airgap_mode.yml for the full mechanism.
#
# Set false ONLY for a range that genuinely has in-game internet — then SO
# fetches upstream itself and none of the staging below is needed.
so_airgap_mode: true

# Where so_apt_mirror clones repos before tarring them (controller-side).
so_airgap_build_dir: "/var/tmp/so-airgap-build"

# Directory SO reads ETOPEN from in airgap mode. NOTE this is a DIRECTORY of
# .rules files (`sourceType: directory`), not a URL — different shape from
# the non-airgap config.
so_airgap_etopen_dest: "/nsm/rules/suricata/etopen"

# Local pillar file carrying the airgap flag. `adv_*` is SO's convention for
# operator overrides; `soc_*` files are owned by the SOC config UI and get
# rewritten by it. If SO's pillar top does not include this file the setting
# silently will not apply — which is exactly why airgap_mode.yml verifies
# `salt-call pillar.get global:airgap` afterwards instead of assuming.
so_airgap_pillar_file: "/opt/so/saltstack/local/pillar/global/adv_global.sls"

# Content repos SO expects locally in airgap mode. `dest` paths come from
# soc/defaults.yaml's `airgap:` blocks — do not invent them.
so_airgap_repos:
  - name: securityonion-resources
    url: "https://github.com/Security-Onion-Solutions/securityonion-resources"
    dest: "/nsm/rules/detect-sigma/repos/securityonion-resources"
  - name: securityonion-yara
    url: "https://github.com/Security-Onion-Solutions/securityonion-yara"
    dest: "/nsm/rules/detect-yara/repos/securityonion-yara"
  - name: securityonion-resources-playbooks
    url: "https://github.com/Security-Onion-Solutions/securityonion-resources-playbooks"
    dest: "/nsm/airgap-resources/playbooks/securityonion-resources-playbooks"

# --- Network layout (dev range) ---
so_subnet_security: "172.16.5.0/24"
so_subnet_operations: "172.16.8.0/24"
so_subnet_engineering: "172.16.6.0/24"
so_subnet_services: "172.16.7.0/24"

# Subnets that bypass the upstream proxy (so_base/environment.j2).
so_no_proxy_subnets:
  - "{{ so_subnet_security }}"
  - "{{ so_subnet_operations }}"
  - "{{ so_subnet_engineering }}"
  - "{{ so_subnet_services }}"

# Subnets allowed to reach the SOC WebUI + so-allow rules.
# For dev: security subnet itself (analyst boxes) + mgmt plane (ansible).
so_allow_subnets:
  - "{{ so_subnet_security }}"
  - "10.255.240.0/20"

# --- Manager reachability from search/sensor ---
so_manager_ip: "172.16.5.10"
so_manager_hostname: "so-manager"

# --- Common Linux baseline ---
common_timezone: "UTC"
common_default_user: "simspace"

# Moved out of roles/so_apt_mirror/defaults/main.yml 2026-08-27, matching
# ss-pp-so. Role defaults are role-scoped, and playbooks that stage installers
# into the mirror (75-endpoint) reference this path WITHOUT including
# so_apt_mirror -- so a role default silently resolves to nothing there. One
# source of truth, visible to every play.
so_mirror_root: /var/www/so-mirror

# =========================================================================
# Ported from ss-pp-so 2026-08-27, along with the roles that consume them.
# =========================================================================
# elastic_agent and so_manager/defend_exclusions.yml reference these. They
# were defined only in the range repo, so the roles would have templated
# undefined variables the first time either ran here.
#
# so_defend_exclusions is intentionally EMPTY: so_manager gates the
# defend_exclusions include on `| default([]) | length > 0`, so an empty list
# means the feature is off, and a range that wants exclusions adds them
# without editing the role.

so_agent_installer_windows: "so-elastic-agent_windows_amd64"

so_agent_installer_linux: "so-elastic-agent_linux_amd64"

# --- Elastic Defend event-filter exclusions -------------------------------
# Managed DIRECTLY against the Kibana API, not through SO's custom-filters
# helper. The helper hardcodes `"os_types": ["windows"]` (line 87 of
# so-elastic-defend-manage-filters.py) and never reads the `operating_system`
# key, so it structurally cannot express a Linux filter -- our first attempt
# was created correctly in every respect and stamped Windows-only, so Defend
# on pp-splunk never evaluated it.
#
# Safe to self-manage: the helper only ever deletes a GUID listed in
# disabled-filters.yaml, and only iterates its own input directories. It never
# enumerates the list, so it cannot touch items it did not create.
#
# ONE filter, not one per event type. The entries key on event.dataset, and
# file_create/file_delete/rename all land in endpoint.events.file -- two rules
# produced byte-identical entries, which is why the second reported "up to
# date" while doing nothing.
#
# Path scope: /opt/splunk/var/ covers both var/lib (index buckets, tsidx,
# .merge) and var/run (dispatch artifacts, splunkd.pid) -- both confirmed in
# the events. /opt/splunk/bin and /opt/splunk/etc stay VISIBLE: app code and
# configuration are what an attacker would modify, and excluding them to save
# events would trade away the detection this host most needs.
so_defend_exclusions: []
# Elastic Defend exclusions, applied by so_manager/tasks/defend_exclusions.yml.
# EMPTY here on purpose -- so_manager gates the include on
# `| default([]) | length > 0`, so an empty list means the feature is off and
# a range opts in without editing the role.
#
# The ss-pp-so entry was deliberately NOT carried across: it excludes
# /opt/splunk/var/* on a specific PowerPlant host, which is range content, not
# a Security Onion default. Shape for a range that wants one:
#
#   so_defend_exclusions:
#     - id: "<uuid>"                 # stable; regenerating it duplicates the rule
#       name: "<short name>"
#       description: "<why, with the measured volume that justifies it>"
#       os_type: linux               # linux | windows | macos
#       dataset: endpoint.events.file
#       field: file.path
#       value: "/path/to/noise/*"

so_defend_filters_src: "/opt/so/saltstack/local/salt/elasticfleet/files/soc/elastic-defend-custom-filters.yaml"

so_defend_filters_out: "/opt/so/conf/elastic-fleet/defend-exclusions/rulesets/custom-filters"

# --- Mirror fidelity threshold -------------------------------------------
# Ceiling on Zeek's own capture_loss, asserted by playbooks/60-verify.yml.
# 5% is generous for a working mirror; this range sat at ~50% from the day it
# was built because nothing read the file. Lives here rather than in
# roles/vyos_mirror/defaults/ because 60-verify targets [so_sensor] and does
# not include that role.
so_capture_loss_max: 5
