---
# =========================================================================
# 60-verify.yml — end-to-end verification of the SO deploy
# =========================================================================
# Cheap checks: so-status on manager, /_cluster/health on search,
# suricata + zeek running on sensor, GRE tunnel up on both ends, packets
# flowing (tcpdump packet count > 0 in a 5-sec window on sensor's tun0).
#
# Actual pass/fail thresholds + output formatting live in verify_so.sh
# (top-level script) which this playbook invokes as its final check.
# =========================================================================

- name: SO manager status
  hosts: so_manager
  become: true
  gather_facts: false
  tasks:
    - name: so-status
      ansible.builtin.command: sudo so-status
      changed_when: false
      register: so_status_out
    - name: report
      ansible.builtin.debug:
        msg: "{{ so_status_out.stdout_lines[-20:] }}"

- name: Elastic cluster health (query from manager; so-elasticsearch-query is manager-only, and cluster health is a whole-cluster metric anyway)
  hosts: so_manager
  become: true
  gather_facts: false
  tasks:
    - name: elastic cluster health
      ansible.builtin.command: sudo so-elasticsearch-query _cluster/health?pretty
      changed_when: false
      register: es_health_out
    - name: report
      ansible.builtin.debug:
        msg: "{{ es_health_out.stdout }}"

- name: SO sensor pcap flow rate
  hosts: so_sensor
  become: true
  gather_facts: false
  vars:
    # Targets MUST be host addresses ON the mirrored subnets — never
    # router-0's own .1 gateway IPs. See the task comment below.
    so_verify_mirror_targets:
      - 172.16.8.5     # ops-wks-01  (Operations,  router eth0)
      - 172.16.6.11    # eng-wks-01  (Engineering, router eth1)
      - 172.16.7.7     # DC01        (Services,    router eth2)
  tasks:
    # On an idle range (empty Ops/Eng/Services subnets) a passive tcpdump
    # reports 0 packets even though the GRE mirror is fully functional.
    # Generate a burst of ICMP into each mirrored subnet from the manager
    # in the background, then tcpdump in the foreground.
    #
    # BUG FIXED 2026-07-29: this previously pinged the .1 GATEWAY IPs
    # (172.16.8.1 etc.), which generates NO mirrorable traffic at all. Those
    # are router-0's own addresses, so the packets are locally delivered on
    # the interface they arrive on (eth3, security) and never egress
    # eth0/eth1/eth2 — where the `tc ... action mirred egress mirror` rules
    # live. The check therefore reported "0 packets captured" even with a
    # perfectly working mirror, and masked the real GRE firewall bug for
    # several deploy cycles.
    #
    # Targets must be addresses ON the mirrored subnets so the router has to
    # forward OUT of the mirrored interface. Unresponsive targets are fine —
    # the router still ARPs on that interface, and ARP frames are mirrored
    # too (confirmed: `gre-proto-0x806` seen encapsulated on the wire).
    - name: Generate mirror-able traffic into Ops/Eng/Services subnets (background)
      ansible.builtin.shell: |
        for tgt in {{ so_verify_mirror_targets | join(' ') }}; do
          ping -c 10 -i 0.5 -W 1 -q -n "$tgt" &
        done
        wait
      delegate_to: "{{ groups['so_manager'][0] }}"
      async: 30
      poll: 0
      changed_when: false
      register: traffic_gen

    - name: 15-sec tcpdump on monitor interface — packet count > 0 means GRE mirror is delivering
      ansible.builtin.shell: |
        timeout 15 tcpdump -i {{ so_monitor_interface }} -c 100 -nn 2>&1 | tail -5
      changed_when: false
      register: pcap_out
      # EXACT LINE match, never a substring. tcpdump prints "100 packets
      # captured", and `'0 packets captured' in stdout` is TRUE for that
      # string -- so the substring form failed precisely when the mirror was
      # WORKING (PowerPlant 2026-08-04, all three sensors at 100 packets).
      # stdout_lines membership is an equality test per line and cannot do
      # that. See UPSTREAM_FIXES 2026-08-04 (later 4).
      failed_when: "'0 packets captured' in pcap_out.stdout_lines"

    - name: report
      ansible.builtin.debug:
        msg: "{{ pcap_out.stdout }}"
