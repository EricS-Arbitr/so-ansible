# =========================================================================
# 00-setup.yml — Init and common vm setup steps
# =========================================================================
# Runs on ansible box itself (ansible_connection=local). Serves ISO +
# eventually SO package/signature mirror over nginx :80. All SO nodes
# fetch the ISO from here during install (see so_manager/so_search/
# so_sensor roles).
# =========================================================================

- name: Init
  hosts: windows
  gather_facts: false
  any_errors_fatal: true
  roles:
    - init
  tags:
    - init

- name: Windows adapter rename pre-config
  hosts: windows
  gather_facts: false
  tasks:
    - name: Rename Windows adapters to canonical Ethernet0/EthernetN by ifIndex order
      ansible.windows.win_powershell:
        script: |
          $adapters = @(Get-NetAdapter | Sort-Object ifIndex)
          $names = @($adapters | ForEach-Object { $_.Name })
          $count = $adapters.Count

          # If all expected canonical names already exist among the adapters,
          # the image's naming is correct — leave it alone. Doing otherwise
          # risks swapping the mgmt/data-plane mapping when ifIndex ordering
          # doesn't match the image's existing Name ordering (which it often
          # doesn't on SimSpace Windows 10/11 images).
          $allCanonical = $true
          for ($i = 0; $i -lt $count; $i++) {
            if ($names -notcontains "Ethernet$i") { $allCanonical = $false; break }
          }
          if ($allCanonical) {
            $Ansible.Changed = $false
            Write-Output "All adapter names already canonical; no rename."
            return
          }

          # Non-canonical naming (e.g. Server 2019 image ships with
          # "Ethernet"/"Ethernet 2"). Rename via a temp-name pass first so
          # the final names can't collide with existing names mid-loop.
          $tempPrefix = "_ppRename_"
          $tempIdx = 0
          foreach ($a in $adapters) {
            Rename-NetAdapter -Name $a.Name -NewName "$tempPrefix$tempIdx" -ErrorAction Stop
            $tempIdx++
          }
          $renamed = @()
          $idx = 0
          foreach ($a in $adapters) {
            $target = "Ethernet$idx"
            Rename-NetAdapter -Name "$tempPrefix$idx" -NewName $target -ErrorAction Stop
            $renamed += "$($a.Name) -> $target"
            $idx++
          }
          $Ansible.Changed = $true
          Write-Output ($renamed -join '; ')
  tags:
    - common
    - win_adapter_rename

# Windows clock correction. Added 2026-07-30 after this broke SOC logins on
# two consecutive ranges.
#
# The platform's hardware clock holds UTC — the Linux hosts read it correctly
# (`timedatectl` reports "RTC in local TZ: no"). Windows, however, treats the
# RTC as LOCAL time by default, so it reads the same value, assumes it is
# Eastern, and computes UTC as RTC + 4h. The workstation then disagrees with
# every Linux node in the range by exactly one timezone offset.
#
# That is not cosmetic. SOC's login page is a JS app: it fetches the kratos
# login flow and compares `expires_at` against the BROWSER's clock. Flows
# live 60 minutes, so a client 4h fast sees every freshly-minted flow as
# ~3h expired and loops forever on "This login form has expired", with no
# server-side error at all. Cost hours to diagnose the first time — see
# UPSTREAM_FIXES 2026-07-29 (later 14).
#
# Two parts, both needed:
#   1. RealTimeIsUniversal makes Windows read the RTC as UTC from the next
#      boot onward — fixes the cause, but only takes effect on reboot.
#   2. An explicit time set corrects the CURRENT session, so no reboot is
#      required to unblock anyone. Idempotent: only fires when drift > 60s.
- name: Windows clock — align with the range's UTC
  hosts: windows
  gather_facts: false
  vars:
    # Evaluated on the controller, whose clock is correct (same UTC RTC,
    # read correctly by Linux).
    range_utc: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
  tasks:
    - name: Treat the RTC as UTC from the next boot (fixes the root cause)
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\TimeZoneInformation
        name: RealTimeIsUniversal
        data: 1
        type: dword

    - name: Correct the running clock if it has drifted from the range
      ansible.windows.win_powershell:
        script: |
          $target = [DateTime]::ParseExact(
            '{{ range_utc }}', 'yyyy-MM-ddTHH:mm:ssZ',
            [Globalization.CultureInfo]::InvariantCulture,
            [Globalization.DateTimeStyles]::AssumeUniversal -bor
            [Globalization.DateTimeStyles]::AdjustToUniversal)
          $drift = [Math]::Abs(((Get-Date).ToUniversalTime() - $target).TotalSeconds)
          if ($drift -gt 60) {
            Set-Date -Date $target.ToLocalTime() | Out-Null
            $Ansible.Changed = $true
            Write-Output ("corrected: was {0:N0}s off, now " -f $drift) + [DateTime]::UtcNow.ToString('o')
          } else {
            $Ansible.Changed = $false
            Write-Output ("ok: {0:N0}s from range UTC" -f $drift)
          }
      register: win_clock

    - name: Report Windows clock state
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ win_clock.output[0] | default('no output') }}"
  tags:
    - common
    - win_clock

# Pre-bootstrap for Linux: drop a NetworkManager conf snippet that opts eth*
# devices INTO management before the common role's nmcli tasks run. Without
# this, netplan's renderer:NetworkManager stub (with no `ethernets:` listed)
# causes NM to mark eth0/eth1 as unmanaged, and nmcli activation fails with
# "No suitable device found for this connection".
- name: Linux NM managed-devices pre-config
  hosts: linux
  gather_facts: false
  become: true
  tasks:
    - name: Ensure NetworkManager is installed
      ansible.builtin.apt:
        name: network-manager
        state: present
    - name: Opt eth* devices into NetworkManager management
      ansible.builtin.copy:
        dest: /etc/NetworkManager/conf.d/99-pp-eth-managed.conf
        content: |
          [keyfile]
          unmanaged-devices=

          [device-eth-managed]
          match-device=interface-name:eth*
          managed=true
        owner: root
        group: root
        mode: '0644'
      register: nm_managed_conf
    - name: Restart NetworkManager if config changed
      ansible.builtin.systemd:
        name: NetworkManager
        state: restarted
        enabled: true
      when: nm_managed_conf.changed
    - name: Wait for NetworkManager to settle after restart
      ansible.builtin.pause:
        seconds: 3
      when: nm_managed_conf.changed
    - name: Force eth devices into managed state at runtime
      ansible.builtin.shell: |
        nmcli device set "{{ item }}" managed yes
      loop:
        - eth0
        - eth1
      register: nmcli_set_managed
      changed_when: "'successfully' in (nmcli_set_managed.stdout | default(''))"
      failed_when: false
  tags:
    - common
    - nm_managed_eth

- name: Common Role
  hosts: windows,linux
  gather_facts: true
  roles:
    - common
  tags:
    - common

# The Ubuntu Desktop images ship with gnome-initial-setup enabled, which
# pops the "Connect Your Online Accounts" / Welcome wizard the first time
# anyone logs into the GUI. Drop the documented "wizard already seen" flag
# file under each existing user's ~/.config and in /etc/skel so future
# users inherit it. gnome-initial-setup checks for this file and exits
# silently when it contains "yes".
- name: Suppress GNOME initial-setup wizard on Linux desktops
  hosts: linux
  gather_facts: false
  become: true
  tasks:
    - name: Find user home directories under /home
      ansible.builtin.find:
        paths: /home
        file_type: directory
        depth: 1
      register: gnome_user_homes

    - name: Ensure ~/.config exists for each user
      ansible.builtin.file:
        path: "{{ item.path }}/.config"
        state: directory
        owner: "{{ item.pw_name }}"
        group: "{{ item.gr_name }}"
        mode: '0755'
      loop: "{{ gnome_user_homes.files }}"

    - name: Mark GNOME initial-setup done for each existing user
      ansible.builtin.copy:
        dest: "{{ item.path }}/.config/gnome-initial-setup-done"
        content: "yes\n"
        owner: "{{ item.pw_name }}"
        group: "{{ item.gr_name }}"
        mode: '0644'
      loop: "{{ gnome_user_homes.files }}"

    - name: Ensure /etc/skel/.config exists for future users
      ansible.builtin.file:
        path: /etc/skel/.config
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Mark GNOME initial-setup done in /etc/skel
      ansible.builtin.copy:
        dest: /etc/skel/.config/gnome-initial-setup-done
        content: "yes\n"
        owner: root
        group: root
        mode: '0644'
  tags:
    - common
    - gnome_initial_setup
